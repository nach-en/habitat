<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Registra tus hábitos de un vistazo." />
    <meta name="theme-color" content="#eceff0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f10" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Habitat" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Reset recomendado por react-native-web -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        /* Evita un destello blanco antes de que cargue la app en modo oscuro. */
        background-color: #eceff0;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0b0f10;
        }
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Necesitas activar JavaScript para usar Habitat.</noscript>
    <div id="root"></div>
  </body>
</html>
